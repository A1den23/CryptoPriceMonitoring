# Docker Compose configuration for Crypto Price Monitoring Bot

services:
  # 价格监控服务
  crypto-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-monitor
    restart: unless-stopped
    command: ["python", "-m", "common.startup", "python", "-m", "monitor"]
    env_file:
      - .env
    volumes:
      # 持久化日志
      - crypto-logs:/app/logs
      - stablecoin-cache:/app/data
    networks:
      - crypto-network
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    # 健康检查 - 与 Dockerfile 保持一致，按主进程选择对应心跳文件
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 安全选项
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # Telegram 交互 Bot 服务
  crypto-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto-bot
    restart: unless-stopped
    command: ["python", "-m", "common.startup", "python", "-m", "bot"]
    env_file:
      - .env
    volumes:
      # 持久化日志
      - crypto-logs:/app/logs
      - stablecoin-cache:/app/data
    networks:
      - crypto-network
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    # 健康检查 - 与 Dockerfile 保持一致，按主进程选择对应心跳文件
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 安全选项
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  crypto-network:
    driver: bridge

volumes:
  crypto-logs:
  stablecoin-cache:
